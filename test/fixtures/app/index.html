<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture app</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a1220;
        color: #e8f1fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main {
        padding: 28px 32px;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      .label {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7f9ab4;
        margin-bottom: 6px;
      }
      pre {
        margin: 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: #060c14;
        border: 1px solid #17263a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 20px;
      }
      button {
        align-self: flex-start;
        padding: 12px 18px;
        border-radius: 10px;
        border: 1px solid rgba(63, 214, 255, 0.5);
        background: rgba(63, 214, 255, 0.16);
        color: #eaf7ff;
        font-size: 15px;
        cursor: pointer;
      }
      #ping-result {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: #3ddc97;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture App</h1>
      <section>
        <div class="label">Arguments received from the host</div>
        <pre id="args" data-testid="app-args">waiting for tool input…</pre>
      </section>
      <section>
        <div class="label">Tool result</div>
        <pre id="result" data-testid="app-result">waiting for tool result…</pre>
      </section>
      <button id="ping" type="button" data-testid="app-ping">Ping server</button>
      <div id="ping-result" data-testid="app-ping-result"></div>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
